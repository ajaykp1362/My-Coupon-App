name: Build Release AAB

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 9.3.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias my-key-alias -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release, O=Android, C=US"

      - name: Inject Credentials and Signing Properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
          echo "storeFile=my-upload-key.jks" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "keyAlias=my-key-alias" >> local.properties
          echo "keyPassword=android" >> local.properties
          echo "RELEASE_STORE_FILE=my-upload-key.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=android" >> local.properties
          echo "RELEASE_KEY_ALIAS=my-key-alias" >> local.properties
          echo "RELEASE_KEY_PASSWORD=android" >> local.properties

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
